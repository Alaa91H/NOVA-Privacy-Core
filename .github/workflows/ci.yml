name: CI

on:
  push:
    branches:
      - main
      - "implementation/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck nftables python3

      - name: Repository test suite
        run: bash tests/run.sh

      - name: Validate no generated secret paths are tracked
        run: |
          ! git ls-files | grep -E '(^|/)(peer-exports|secrets)/|\.(key|psk|p12|pfx)$'
