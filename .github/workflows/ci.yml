name: CI

on:
  push:
    branches:
      - main
      - "implementation/**"
      - "audit/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck nftables python3

      - name: Repository test suite
        run: bash tests/run.sh

      - name: Privileged firewall renderer integration test
        run: sudo -E bash tests/test-render-firewall.sh

      - name: Target Ubuntu 26.04 LTS compatibility validation
        run: |
          docker run --rm --platform linux/amd64             -v "$PWD:/src:ro"             ubuntu:26.04@sha256:da6fc2be547864451aa253836dd926da33623312df4a9a243e35dc877c378a78             bash -Eeuo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends                 bash git shellcheck nftables python3 ca-certificates                 openssh-server unbound systemd-zram-generator cryptsetup-bin                 jq gh iproute2 procps
              . /etc/os-release
              [[ "$ID" == "ubuntu" && "$VERSION_ID" == "26.04" ]]
              dpkg --compare-versions "$(dpkg-query -W -f="${Version}" unbound)" ge "1.24.2-1ubuntu2.1"
              ssh -Q kex | grep -qx mlkem768x25519-sha256
              apt-cache show linux-oracle-7.0 >/dev/null
              mkdir -p /work
              cp -a /src/. /work/
              cd /work
              bash tests/run.sh
              bash tests/test-render-firewall.sh
            '

      - name: Validate no generated secret paths are tracked
        shell: bash
        run: |
          set -Eeuo pipefail
          tracked="$(
            git ls-files |
              grep -E '(^|/)(peer-exports|secrets)/|\.(key|psk|p12|pfx|agekey)$|\.tar\.age$' ||
              true
          )"
          if [[ -n "$tracked" ]]; then
            printf 'Tracked secret/generated paths:\n%s\n' "$tracked" >&2
            exit 1
          fi
