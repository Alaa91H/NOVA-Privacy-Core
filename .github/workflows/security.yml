name: Security Audit

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install audit tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck python3

      - name: Static security audit
        run: bash scripts/security-audit-static.sh

      - name: Dependency/update visibility
        run: |
          printf 'Pinned AdGuard Home: '
          grep '^NOVA_ADGUARD_VERSION=' config/defaults.env | cut -d= -f2-
          printf 'Review upstream security advisories before every production update.\n'
